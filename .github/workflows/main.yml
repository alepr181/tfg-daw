name: Proyecto Intermodular - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend | Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front/supermarket-front

    steps:
      - name: Acceso al repositorio
        uses: actions/checkout@v4

      - name: Instalación y setup de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/supermarket-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el paquete desplegable de Angular
        run: npm run build

  backend:
    name: Backend | Laravel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back/pi-supermercado

    steps:
      - name: Acceso al repositorio
        uses: actions/checkout@v4

      - name: Instalación y setup de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar entorno de Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Validar configuración de Laravel
        run: |
          php artisan config:clear
          php artisan route:list

  deploy:
    name: Deploy | VPS
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Desplegar en VPS por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/pruz/tfg-daw
            git reset --hard
            git clean -fd -e back/pi-supermercado/.env.production
            git pull origin main
            docker compose up -d --build
            docker compose exec -T backend php artisan config:clear
            docker compose exec -T backend php artisan migrate --force
            docker compose exec -T backend php artisan route:clear
            docker compose exec -T backend php artisan view:clear
            docker compose exec -T backend php artisan cache:clear