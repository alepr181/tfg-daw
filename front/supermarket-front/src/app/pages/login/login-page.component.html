<section class="min-h-dvh bg-slate-100 px-6 py-8">
<div class="mx-auto grid min-h-dvh max-w-md place-items-center">
    <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-lg">
    <header class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Iniciar sesión
        </h1>

        <p class="mt-2 text-sm text-slate-600">
        Accede con tu cuenta para continuar.
        </p>
    </header>

    <app-login-form-component
        [isLoading]="isLoading()"
        (loginSubmit)="onLoginSubmit($event)"
    />
    </div>
</div>
</section>
