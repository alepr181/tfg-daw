<section class="min-h-dvh bg-slate-100">
    <div class="grid min-h-dvh grid-cols-[15rem_1fr]">
        <aside class="sticky top-0 h-dvh border-r border-slate-200 bg-white px-4 py-5">
            <div class="flex h-full w-full flex-col">
                <div class="mb-6">
                    <h1 class="text-lg font-semibold text-slate-900">
                        Administración
                    </h1>
                </div>

                <nav class="space-y-1" aria-label="Navegación de administración">
                    <a
                        [routerLink]="['/admin/dashboard']"
                        routerLinkActive="bg-slate-100 text-slate-950"
                        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"
                    >
                        <i class="fa-solid fa-chart-line w-4"></i>
                        Dashboard
                    </a>

                    <a
                        [routerLink]="['/admin/products']"
                        routerLinkActive="bg-slate-100 text-slate-950"
                        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"
                    >
                        <i class="fa-solid fa-box w-4"></i>
                        Productos
                    </a>

                    <a
                        [routerLink]="['/admin/suppliers']"
                        routerLinkActive="bg-slate-100 text-slate-950"
                        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"
                    >
                        <i class="fa-solid fa-truck w-4"></i>
                        Proveedores
                    </a>

                    <a
                        [routerLink]="['/admin/orders']"
                        routerLinkActive="bg-slate-100 text-slate-950"
                        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"
                    >
                        <i class="fa-solid fa-receipt w-4"></i>
                        Pedidos
                    </a>

                    <a
                        [routerLink]="['/admin/users']"
                        routerLinkActive="bg-slate-100 text-slate-950"
                        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900"
                    >
                        <i class="fa-solid fa-users w-4"></i>
                        Usuarios
                    </a>
                </nav>

                <div class="mt-auto border-t border-slate-200 pt-4">
                    <p class="text-sm font-medium text-slate-900">
                        ¡Hola, {{ user?.name }}!
                    </p>

                    <button
                        type="button"
                        class="mt-3 flex w-full items-center justify-center gap-2 rounded-lg border border-red-200 px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50 hover:text-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 cursor-pointer"
                        (click)="logout()"
                    >
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </aside>

        <main class="min-w-0 p-6">
            <router-outlet />
        </main>
    </div>
</section>
