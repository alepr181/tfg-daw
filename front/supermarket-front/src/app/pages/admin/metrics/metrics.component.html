<section class="space-y-6">
    <header class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">
            Dashboard
        </h1>

        <p class="mt-1 text-sm text-slate-600">
            Bienvenido al menú de administración.
        </p>
    </header>

    @if (metricsResource.isLoading()) {
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <p class="text-sm text-slate-600">
            Cargando métricas...
        </p>
    </div>
    } @else if (metricsResource.error()) {
    <div class="rounded-2xl border border-red-200 bg-white p-6 shadow-sm">
        <p class="text-sm text-red-600">
            No se pudieron cargar las métricas.
        </p>
    </div>
    } @else {

    <div class="space-y-6">
        <app-summary-metrics
            class="block mb-6"
            [summary]="metrics().summary"
        />

        <div class="grid gap-6 xl:grid-cols-[1.2fr_0.8fr]">
            <app-top-products-metrics
                class="block min-w-0"
                [products]="metrics().top_products"
            />

            <app-payment-methods-metrics
                class="block min-w-0"
                [paymentMethods]="metrics().payment_methods"
            />
        </div>

        <app-low-stock-metrics
            class="block min-w-0"
            [products]="metrics().low_stock_products"
        />
    </div>
    }
</section>
