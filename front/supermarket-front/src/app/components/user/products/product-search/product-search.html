<div class="rounded-2xl bg-white p-4 shadow">
  <form
    role="search"
    aria-label="Buscar productos"
    class="flex flex-col gap-3 md:flex-row"
  >
    <input
      type="search"
      name="search"
      placeholder="Buscar producto por nombre o código..."
      aria-label="Buscar producto"
      class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
    />

    <button
      type="submit"
      class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      Buscar
    </button>
  </form>
</div>
