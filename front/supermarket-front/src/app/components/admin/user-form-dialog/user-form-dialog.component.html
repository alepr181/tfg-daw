<h2 mat-dialog-title class="px-6 pt-6 text-xl font-bold text-slate-900">
@if (data.user) {
    Editar usuario
} @else {
    Añadir usuario
}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
<mat-dialog-content class="p-6 space-y-4">
    <label class="block space-y-2">
    <span class="text-sm font-medium text-slate-700">Nombre</span>
    <input
        type="text"
        formControlName="name"
        placeholder="Nombre del usuario"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    />

    @if (form.controls.name.invalid && form.controls.name.touched) {
        <p class="text-sm text-red-600">El nombre es obligatorio.</p>
    }
    </label>

    <label class="block space-y-2">
    <span class="text-sm font-medium text-slate-700">Email</span>
    <input
        type="email"
        formControlName="email"
        placeholder="Email del usuario"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    />

    @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="text-sm text-red-600">Introduce un email válido.</p>
    }
    </label>

    <label class="block space-y-2">
    <span class="text-sm font-medium text-slate-700">Contraseña</span>
    <input
        type="password"
        formControlName="password"
        placeholder="Contraseña"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    />

    @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="text-sm text-red-600">La contraseña debe tener al menos 6 caracteres.</p>
    }
    </label>

    <div class="grid gap-4 md:grid-cols-2">
    <label class="block space-y-2">
        <span class="text-sm font-medium text-slate-700">Rol</span>

        <select
        formControlName="role"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        >
        <option value="admin">Admin</option>
        <option value="user">Usuario</option>
        </select>
    </label>

    <label class="block space-y-2">
        <span class="text-sm font-medium text-slate-700">Estado</span>

        <select
        formControlName="account_status"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        >
        <option value="active">Activo</option>
        <option value="inactive">Inactivo</option>
        </select>
    </label>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-2">
    <button
    type="button"
    class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
    (click)="close()"
    >
    Cancelar
    </button>

    <button
    type="submit"
    class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="form.invalid"
    >
    Guardar
    </button>
</mat-dialog-actions>
</form>
